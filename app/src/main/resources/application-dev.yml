spring:
  # Dev-only: reach Supabase via the IPv4 session-mode pooler (the direct db.<ref> host is
  # IPv6-only and unroutable on many networks). Session mode (port 5432) — NOT transaction mode
  # (6543) — because Hibernate/JDBC use server-side prepared statements (prepareThreshold in base
  # config), which the transaction pooler does not support. password/driver/hikari inherit from base.
  datasource:
    url: jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres
    username: postgres.yvmwtlxnxywgbhndamjs
  jpa:
    hibernate:
      ddl-auto: update
  # Mailgun configuration for development environment
  mail:
    host: smtp.mailgun.org
    username: sandboxdb81cc8bd1004b178d1cfd38d8f5cc74.mailgun.org@sandboxdb81cc8bd1004b178d1cfd38d8f5cc74.mailgun.org

jwt:
  expiration-minutes: 1000

nginx:
  require-proxy: false

chirp:
  email:
    url: "http://localhost:8080"
  rate-limit:
    ip:
      apply-limit: false
  web-socket:
    allowed-origin: "http://localhost:8080"

  logging:
    level:
      com.project.chirp: DEBUG
